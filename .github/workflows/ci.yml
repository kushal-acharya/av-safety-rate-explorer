name: Verify AV Evidence
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: python -m pip install uv
      - run: uv sync --locked
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run pytest -q
      - run: uv run python scripts/reproduce_study.py --check
      - run: uv run python scripts/reproduce_geography.py --check
      - run: npm ci && npm run check:css && npm run typecheck && npm test && npm run build
      - run: npx playwright install --with-deps chromium
      - name: Browser interaction checks
        run: |
          npx wrangler dev --port 8789 > /tmp/av-preview.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://localhost:8789/waymo-project/ > /dev/null; then break; fi
            sleep 1
          done
          npm run test:browser
          node scripts/test_accessibility.js
