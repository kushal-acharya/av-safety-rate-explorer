[project]
name = "av-safety-rate-explorer"
version = "0.1.0"
description = "An honest, reproducible explorer of autonomous vehicle disengagement rates"
requires-python = ">=3.11"
dependencies = ["streamlit>=1.40", "pandas>=2.2", "scipy>=1.14", "statsmodels>=0.14", "plotly>=5.24", "pyarrow>=18", "requests>=2.32"]
[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]
research = [
    "pypdf>=6,<7",
]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/av_safety"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]
[tool.pytest.ini_options]
testpaths = ["tests"]
